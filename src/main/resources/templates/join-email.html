<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Join Docket</title>
</head>
<body>
<main class="page">
    <h1 class="title-serif">Where can we reach you?</h1>
    <div class="prose">
        <p>Your email address is your account. Docket sends a link to sign in — there is no
            password, ever — so the inbox is the one thing to keep hold of. Private aliases
            (Hide My Email, SimpleLogin, and the like) are welcome.</p>
    </div>
    <p class="label" th:if="${error}" th:text="${error}" style="color: var(--ac); text-transform: none; letter-spacing: 0; max-width: 30rem;">error</p>
    <form method="post" action="/join/link" style="display: flex; gap: var(--s-2); margin-top: var(--s-6);">
        <input type="hidden" name="ageKind" th:value="${ageKind}">
        <input type="hidden" name="birthMonth" th:if="${birthMonth != null}" th:value="${birthMonth}">
        <input type="hidden" name="birthYear" th:if="${birthYear != null}" th:value="${birthYear}">
        <label for="email" class="label" style="position: absolute; left: -9999px;">Email</label>
        <input id="email" name="email" class="search" style="width: 20rem;" type="email"
               placeholder="you@example.org" required autofocus>
        <button class="btn primary" type="submit">Send my link</button>
    </form>
</main>
</body>
</html>
