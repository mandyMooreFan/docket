<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Docket</title>
</head>
<body>
<main class="page">
    <h1 class="title-serif">One more click</h1>
    <div class="prose">
        <p>Press the button and you're in. (The button exists so an email scanner following
            your link can't use it up on your behalf.)</p>
    </div>
    <form method="post" action="/auth" style="margin-top: var(--s-6);">
        <input type="hidden" name="token" th:value="${token}">
        <button class="btn primary" type="submit">Continue to Docket</button>
    </form>
</main>
</body>
</html>
