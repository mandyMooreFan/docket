<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Docket</title>
</head>
<body>
<main class="page">
    <article>
        <header style="display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-6);">
            <a class="av av-40" th:href="'/p/' + ${page.post.author.memberId}"
               th:insert="~{fragments/avatar :: face(${page.post.author.initials},
                            ${page.post.author.photoImageId})}">·</a>
            <div>
                <p style="margin: 0; font-family: var(--serif); font-size: var(--t-18); font-weight: 600;">
                    <a th:href="'/p/' + ${page.post.author.memberId}" style="color: var(--i900);"
                       th:text="${page.post.author.displayName()}">Name</a>
                </p>
                <p class="meta" style="margin: 0;" th:text="${page.post.when}">1 Aug 2026</p>
            </div>
        </header>
        <div class="prose" th:utext="${page.post.bodyHtml}"></div>
        <!-- §5.2.2: the attached posting — a compact card, app-said, sans. -->
        <a class="posting-card" th:if="${page.post.attached != null}"
           th:href="'/jobs/' + ${page.post.attached.id}">
            <span th:text="${page.post.attached.title}">Title</span>
            <span class="meta" style="margin-top: var(--s-1);">
                <span th:text="${page.post.attached.company}">Company</span>
                <span class="salary" th:text="${page.post.attached.salaryLine}">£45,000</span>
                <span th:unless="${page.post.attached.open}">Closed</span>
            </span>
        </a>
        <div class="post-images" th:if="${!page.post.imageIds.isEmpty()}">
            <img th:each="imageId : ${page.post.imageIds}" th:src="'/images/' + ${imageId}" alt="">
        </div>
        <p class="link-preview" th:each="link : ${page.post.links}">
            <a th:href="${link.url}" rel="nofollow noopener" th:text="${link.domain}">domain</a>
        </p>

        <!-- §5.3: the private Save — yours alone, counted nowhere (§5.6). -->
        <div th:if="${page.viewerSignedIn}" style="margin-top: var(--s-4);">
            <form th:if="${!page.post.saved}" method="post"
                  th:action="'/posts/' + ${page.post.id} + '/save'">
                <button class="btn quiet sm" type="submit">Save</button>
            </form>
            <form th:if="${page.post.saved}" method="post"
                  th:action="'/posts/' + ${page.post.id} + '/unsave'">
                <button class="btn quiet sm" type="submit">Saved — unsave</button>
            </form>
        </div>
    </article>

    <!-- §5.3: Replies — the count is this viewer's, and counts what this page shows. -->
    <section class="block">
        <h2>Replies</h2>
        <p class="meta" th:if="${page.post.replyCount > 0}"
           th:text="${page.post.replyCountLabel()}">1 reply</p>

        <article class="entry" th:each="reply : ${page.replies}">
            <p class="org">
                <a th:href="'/p/' + ${reply.author.memberId}"
                   th:text="${reply.author.displayName()}">Name</a> ·
                <span class="when" th:text="${reply.when}">1 Aug 2026</span>
            </p>
            <div class="prose" style="font-size: var(--t-16);" th:utext="${reply.bodyHtml}"></div>
            <form th:if="${page.mayModerate}" method="post" style="margin-top: var(--s-2);"
                  th:action="'/posts/' + ${page.post.id} + '/replies/' + ${reply.id} + '/remove'">
                <button class="btn quiet sm" type="submit">Remove</button>
            </form>
        </article>

        <p class="meta" th:if="${page.closed}">The author has closed this thread.</p>

        <p class="label" th:if="${error}" th:text="${error}"
           style="color: var(--ac); text-transform: none; letter-spacing: 0;">error</p>

        <form th:if="${page.mayReply}" method="post" class="form" style="margin-top: var(--s-8);"
              th:action="'/posts/' + ${page.post.id} + '/replies'">
            <textarea class="input" name="body" rows="3"
                      placeholder="A reply costs a sentence — that's the point."></textarea>
            <div><button class="btn" type="submit">Reply</button></div>
        </form>

        <!-- §5.3: no reply affordance outside the author's connections — said plainly. -->
        <p class="meta" th:if="${page.connectionsOnlyNote}"
           th:text="'Replies are open to ' + ${page.post.author.displayName()} + '’s connections.'">
            Replies are open to the author's connections.</p>

        <form th:if="${page.mayModerate and !page.closed}" method="post"
              style="margin-top: var(--s-6);"
              th:action="'/posts/' + ${page.post.id} + '/close'">
            <button class="btn quiet sm" type="submit">Close thread</button>
        </form>
    </section>
</main>
</body>
</html>
