<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Messages — Docket</title>
</head>
<body>
<main class="page">
    <header>
        <h1 class="title-serif" style="font-size: var(--t-30);">Messages</h1>
    </header>

    <!-- §13.4: the empty inbox says what it is. This copy is spec surface. -->
    <div class="prose" th:if="${inbox.rows.isEmpty()}" style="margin-top: var(--s-8);">
        <p>Messages open when you're connected to someone, or when someone applies to your
            posting. No connections yet — your inbox is waiting on the graph, not on you.</p>
    </div>

    <!-- §7.2: the inbox is a list of people, newest correspondence first. No per-row
         count, dot or unread mark — §5.6 refuses those, and §7.4's one exception is
         the single count on the Messages nav item. -->
    <section class="block" th:if="${!inbox.rows.isEmpty()}">
        <article class="entry person" th:each="row : ${inbox.rows}">
            <span class="av av-40"
                  th:insert="~{fragments/avatar :: face(${row.person.initials}, ${row.person.photoImageId})}">·</span>
            <div class="said">
                <h3><a th:href="'/messages/' + ${row.otherId}"
                       th:text="${row.person.displayName()}">Name</a></h3>
                <p class="org">
                    <span class="when" th:text="${row.when}">1 Aug 2026, 09:12</span>
                </p>
                <p th:text="${row.latest}">Their latest words</p>
            </div>
        </article>
    </section>
</main>
</body>
</html>
