<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Join Docket</title>
</head>
<body>
<main class="page">
    <h1 class="title-serif">When were you born?</h1>
    <div class="prose">
        <p>Docket asks everyone this one question first, before anything else. Month and year is
            all it ever asks — and for an adult, the answer isn't kept.</p>
    </div>
    <p class="label" th:if="${error}" th:text="${error}" style="color: var(--ac); text-transform: none; letter-spacing: 0;">error</p>
    <form method="post" action="/join" style="display: flex; gap: var(--s-2); margin-top: var(--s-6); align-items: center;">
        <label for="month" class="label" style="margin: 0;">Month</label>
        <select id="month" name="month" class="search" style="width: auto;" required>
            <option value="1">January</option><option value="2">February</option>
            <option value="3">March</option><option value="4">April</option>
            <option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option>
            <option value="9">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
        </select>
        <label for="year" class="label" style="margin: 0;">Year</label>
        <input id="year" name="year" class="search" style="width: 7rem;" type="number"
               min="1900" th:max="${currentYear}" required>
        <button class="btn primary" type="submit">Continue</button>
    </form>
</main>
</body>
</html>
