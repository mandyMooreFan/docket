<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, main)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Docket</title>
    <link rel="stylesheet" href="/css/docket.css">
    <script src="/vendor/htmx-2.0.10.min.js" defer></script>
</head>
<body>
<header class="appbar">
    <div class="appbar-inner">
        <a class="wordmark" href="/">Docket</a>
        <nav>
            <a href="/">Feed</a>
            <a href="/jobs">Jobs</a>
            <a href="/messages">Messages</a>
            <a href="/network">Network</a>
        </nav>
        <!-- §8: one box in the app bar, returning people, companies, posts and
             jobs. A GET, so a search is a link; the page itself carries the one
             tickable filter (§8.2) rather than crowding the bar with it. -->
        <form class="appbar-search" method="get" action="/search" role="search">
            <input class="search" type="search" name="q" placeholder="Search"
                   aria-label="Search Docket">
        </form>
        <div class="right">
            <!-- AGPL §13: durable Source link, reachable from every page, logged in or out -->
            <a class="source-link" href="https://github.com/mandyMooreFan/docket">Source</a>
            <th:block th:if="${currentMember != null}">
                <a class="av av-32" href="/profile" th:text="${currentMember.initial}"
                   th:title="${currentMember.email}">D</a>
            </th:block>
            <th:block th:if="${currentMember == null}">
                <a class="btn sm" href="/login">Sign in</a>
                <a class="btn sm primary" href="/join">Join</a>
            </th:block>
        </div>
    </div>
</header>
<main th:replace="${main}"></main>
</body>
</html>
