# The §10.1 owner, named for the whole test run rather than per suite.
#
# Deliberately here and not in a @TestPropertySource on the moderation suite: a
# property source that only some classes carry forks a second Spring context, and a
# second context starts its clock at real time while the SHARED Postgres already
# carries rate-limit ledger rows stamped by the first context's far-advanced
# SteppingClock. Every sign-up in the forked context then reads as rate-limited and
# no mail is ever sent. One context, one clock, one ledger.
docket.owner-email=mod-owner@docket.test
