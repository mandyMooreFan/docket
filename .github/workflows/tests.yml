# Runs the tests on every PR and on main. Deploy automation deliberately lives
# elsewhere: it belongs to the successor deployment effort (SPEC.md §17.1).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode verify
